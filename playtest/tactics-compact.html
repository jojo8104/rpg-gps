<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vérification visuelle du combat</title><link rel="stylesheet" href="/app/css/style.css"><link rel="stylesheet" href="/app/css/battle-duel.css"><link rel="stylesheet" href="/app/css/battle-tactics.css"><link rel="stylesheet" href="/app/css/battle-tactics-compact.css"><style>body{margin:0;background:#08110d}#preview{max-width:580px;margin:auto}</style><div id="preview"></div><script type="module">
