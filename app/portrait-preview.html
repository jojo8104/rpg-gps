<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aperçu du personnage</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .editor-guides .composed-portrait__person {
        outline: 1px dashed #ffdc63;
      }
      .editor-guides .composed-portrait__person::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(
            90deg,
            transparent calc(50% - 0.5px),
            #ffdc6380 50%,
            transparent calc(50% + 0.5px)
          ),
          linear-gradient(
            transparent calc(38.5% - 0.5px),
            #ffdc6380 38.5%,
            transparent calc(38.5% + 0.5px)
          );
      }
      .editor-transparent .composed-portrait {
        background: repeating-conic-gradient(#344038 0% 25%, #202b25 0% 50%)
          0/20px 20px;
      }
      .editor-transparent .composed-portrait__background {
        display: none;
      }
    </style>
  </head>
  <body>
    <section
      id="preview-dialogue"
      class="dialogue-view"
      aria-label="Dialogue de prévisualisation"
    ></section>
    <script type="module" src="js/ui/portrait-editor-preview.js"></script>
  </body>
</html>
